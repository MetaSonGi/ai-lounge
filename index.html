<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI라운지 — 현장이 묻고, AI가 돕다</title>
<meta name="description" content="영상과 이미지 한 폴더를 컨셉별로 자동 분류하고, 5가지 갤러리 스타일로 바꿔 보는 웹 라운지">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🏭</span>
    <div class="brand-text">
      <h1>AI라운지</h1>
      <p>현장이 묻고, AI가 돕다</p>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn primary" id="btnFolder">📁 폴더 열기</button>
    <button class="btn ghost" id="btnFiles">＋ 파일 추가</button>
    <button class="btn ghost" id="btnDemo">✨ 데모로 체험</button>
    <button class="btn icon" id="btnSettings" title="설정">⚙️</button>
  </div>
</header>
<input type="file" id="folderInput" webkitdirectory multiple hidden>
<input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>

<section class="askbar">
  <div class="askbox">
    <span class="ask-emoji">💬</span>
    <input id="askInput" type="text" maxlength="200"
      placeholder="현장에서 궁금한 걸 물어보세요. 예) 로봇팔 설치할 때 참고할 사진 보여줘">
    <button class="btn primary" id="btnAsk">묻기</button>
  </div>
  <div class="ai-badge" id="aiBadge" title="질문 큐레이션 방식">🔌 오프라인 모드</div>
</section>

<section class="curation" id="curationPanel" hidden>
  <div class="curation-head">
    <span class="curation-tag" id="curationTag">✨ AI 선별</span>
    <h2 id="curationTitle"></h2>
    <button class="btn icon sm" id="btnCurationClose" title="닫기">✕</button>
  </div>
  <p class="curation-summary" id="curationSummary"></p>
  <div class="curation-actions">
    <button class="btn primary sm" id="btnApplyCuration">선별 결과만 보기</button>
    <button class="btn ghost sm" id="btnClearCuration">전체로 복귀</button>
  </div>
  <div class="curation-picks" id="curationPicks"></div>
</section>

<nav class="styleswitch" id="styleSwitch">
  <button data-style="grid" class="active">▦ 그리드</button>
  <button data-style="masonry">🧱 매서너리</button>
  <button data-style="film">🎞️ 필름스트립</button>
  <button data-style="wall3d">🧊 3D 월</button>
  <button data-style="cinema">🎬 시네마</button>
</nav>

<div class="chips" id="chipRow"></div>

<main id="gallery" class="gallery"></main>

<div class="empty" id="emptyState">
  <div class="empty-art">📂🎞️🤖</div>
  <h2>미디어 폴더를 열어주세요</h2>
  <p>영상과 이미지가 담긴 <b>폴더 하나</b>를 열면<br>컨셉별로 자동 분류된 라운지가 펼쳐집니다.</p>
  <div class="empty-btns">
    <button class="btn primary" id="btnEmptyFolder">📁 폴더 열기</button>
    <button class="btn ghost" id="btnEmptyDemo">✨ 데모로 먼저 체험</button>
  </div>
  <p class="empty-note">파일은 서버로 전송되지 않고 브라우저 안에서만 열립니다</p>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close btn icon" id="lbClose">✕</button>
  <button class="lb-nav prev btn icon" id="lbPrev">‹</button>
  <button class="lb-nav next btn icon" id="lbNext">›</button>
  <div class="lb-media" id="lbMedia"></div>
  <div class="lb-info">
    <h3 id="lbTitle"></h3>
    <div class="lb-tags" id="lbTags"></div>
    <p id="lbDesc"></p>
  </div>
</div>

<div class="cinema" id="cinema" hidden>
  <div class="cinema-stage" id="cinemaStage"></div>
  <div class="cinema-bar">
    <div class="cinema-caption">
      <h3 id="cinemaTitle"></h3>
      <div class="lb-tags" id="cinemaTags"></div>
    </div>
    <div class="cinema-controls">
      <button class="btn icon" id="cinemaPrev">‹</button>
      <span class="cinema-count" id="cinemaCount"></span>
      <button class="btn icon" id="cinemaNext">›</button>
      <button class="btn icon" id="cinemaClose">✕</button>
    </div>
  </div>
</div>

<div class="modal" id="settingsModal" hidden>
  <div class="modal-card">
    <h2>⚙️ 설정</h2>
    <label class="field">
      <span>Gemini API 키 <small>(선택 — 입력하면 "현장이 묻다"가 AI 큐레이션으로 동작)</small></span>
      <input type="password" id="apiKeyInput" placeholder="AIza...">
    </label>
    <p class="hint">키는 이 브라우저의 localStorage에만 저장됩니다. 미입력 시 오프라인 키워드 매칭으로 동작합니다.<br>
    키 발급: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a></p>
    <div class="modal-actions">
      <button class="btn ghost sm" id="btnClearKey">키 지우기</button>
      <span class="spacer"></span>
      <button class="btn ghost sm" id="btnSettingsClose">닫기</button>
      <button class="btn primary sm" id="btnSaveKey">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
